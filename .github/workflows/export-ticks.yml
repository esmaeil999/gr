name: Export Ticks

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (e.g. EURUSD, XAUUSD)"
        required: true
        default: "EURUSD"
        type: string
      start:
        description: "Start date/time UTC (YYYY-MM-DD or YYYY-MM-DD HH:mm)"
        required: true
        type: string
      end:
        description: "End date/time UTC (exclusive) (YYYY-MM-DD or YYYY-MM-DD HH:mm)"
        required: true
        type: string
      create_release:
        description: "Create GitHub Release with the zip?"
        required: false
        default: true
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    # Yearly ranges can take a long time. Adjust if needed.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build
        run: mvn -B -q clean package -DskipTests

      - name: Run Tick Exporter
        env:
          DUKASCOPY_USERNAME: ${{ secrets.DUKASCOPY_USERNAME }}
          DUKASCOPY_PASSWORD: ${{ secrets.DUKASCOPY_PASSWORD }}
          INSTRUMENT: ${{ inputs.symbol }}
          FROM: ${{ inputs.start }}
          TO: ${{ inputs.end }}
          OUTPUT_DIR: ./output
        run: |
          set -e
          java -Xmx4g -jar target/jforex-tick-exporter-1.0.0.jar
          echo "=== Output files ==="
          ls -lh output/

      - name: Zip CSV
        id: zip
        run: |
          set -e
          CSV=$(ls output/*.csv | head -n1)
          BASENAME=$(basename "$CSV" .csv)
          ZIP="${BASENAME}.zip"
          zip -j "$ZIP" "$CSV"
          echo "zip_path=$ZIP" >> $GITHUB_OUTPUT
          echo "csv_name=$BASENAME" >> $GITHUB_OUTPUT
          ls -lh "$ZIP"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticks-${{ steps.zip.outputs.csv_name }}
          path: ${{ steps.zip.outputs.zip_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ticks-${{ steps.zip.outputs.csv_name }}
          name: Ticks ${{ inputs.symbol }} ${{ inputs.start }} → ${{ inputs.end }}
          body: |
            Tick data export from Dukascopy (JForex SDK)

            - **Symbol**: `${{ inputs.symbol }}`
            - **From (UTC)**: `${{ inputs.start }}`
            - **To (UTC, exclusive)**: `${{ inputs.end }}`
            - **Generated by**: GitHub Actions run ${{ github.run_id }}
          files: ${{ steps.zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

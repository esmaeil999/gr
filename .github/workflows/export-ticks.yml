name: Export Ticks

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (e.g. EURUSD, XAUUSD)"
        required: true
        default: "EURUSD"
        type: string
      start_year:
        description: "Start year (e.g. 2015)"
        required: true
        type: string
      end_year:
        description: "End year inclusive (e.g. 2026)"
        required: true
        type: string
      create_release:
        description: "Create GitHub Release per year?"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - name: Build list of years
        id: years
        shell: bash
        run: |
          set -euo pipefail
          START="$(echo '${{ inputs.start_year }}' | tr -dc '0-9')"
          END="$(echo '${{ inputs.end_year }}' | tr -dc '0-9')"

          if [ -z "$START" ] || [ -z "$END" ]; then
            echo "::error::start_year / end_year must be numeric years, e.g. 2015 and 2026"; exit 1
          fi
          if [ "$START" -gt "$END" ]; then
            echo "::error::start_year ($START) must be <= end_year ($END)"; exit 1
          fi

          LIST=""
          for y in $(seq "$START" "$END"); do
            LIST="${LIST:+$LIST,}$y"
          done
          YEARS="[$LIST]"

          if [ "$YEARS" = "[]" ]; then
            echo "::error::No years generated"; exit 1
          fi

          echo "Years to export: $YEARS"
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"

  export:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # One year at a time, in ascending order (2015, 2016, ...)
      max-parallel: 1
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}

    env:
      YEAR: ${{ matrix.year }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build
        run: mvn -B -q clean package -DskipTests

      - name: Compute date range
        id: range
        run: |
          NEXT=$((YEAR + 1))
          echo "from=${YEAR}-01-01 00:00" >> $GITHUB_OUTPUT
          echo "to=${NEXT}-01-01 00:00" >> $GITHUB_OUTPUT
          echo "Range: ${YEAR}-01-01 00:00 -> ${NEXT}-01-01 00:00"

      - name: Run Tick Exporter
        env:
          DUKASCOPY_USERNAME: ${{ secrets.DUKASCOPY_USERNAME }}
          DUKASCOPY_PASSWORD: ${{ secrets.DUKASCOPY_PASSWORD }}
          INSTRUMENT: ${{ inputs.symbol }}
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
          OUTPUT_DIR: ./output
        run: |
          set -e
          java -Xmx4g -jar target/jforex-tick-exporter-1.0.0.jar
          echo "=== Output files ==="
          ls -lh output/

      - name: Zip CSV
        id: zip
        run: |
          set -e
          CSV=$(ls output/*.csv | head -n1)
          ZIP="ticks-${{ inputs.symbol }}-${YEAR}.zip"
          zip -j "$ZIP" "$CSV"
          echo "zip_path=$ZIP" >> $GITHUB_OUTPUT
          ls -lh "$ZIP"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticks-${{ inputs.symbol }}-${{ matrix.year }}
          path: ${{ steps.zip.outputs.zip_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ticks-${{ inputs.symbol }}-${{ matrix.year }}
          name: Ticks ${{ inputs.symbol }} ${{ matrix.year }}
          body: |
            Tick data export from Dukascopy (JForex SDK)

            - **Symbol**: `${{ inputs.symbol }}`
            - **From (UTC)**: `${{ steps.range.outputs.from }}`
            - **To (UTC, exclusive)**: `${{ steps.range.outputs.to }}`
            - **Generated by**: GitHub Actions run ${{ github.run_id }}
          files: ${{ steps.zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
